name: investigator-ci

on:
  pull_request:
    paths:
      - "investigator/**"
      - "contracts/**"
      - ".github/workflows/investigator-ci.yml"
  push:
    branches: [main]
    paths:
      - "investigator/**"
      - "contracts/**"
      - ".github/workflows/investigator-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: investigator
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install
      - name: Sync dependencies (lock 파일과 불일치하면 실패)
        run: uv sync --locked
      - name: Import check
        run: uv run --locked python -c "from mcp.server.fastmcp import FastMCP; from anthropic import AsyncAnthropic; from pydantic import BaseModel"
      - name: Tests
        # 테스트가 아직 없을 때(pytest 종료 코드 5)는 통과로 처리합니다.
        run: |
          set +e
          uv run --locked pytest -q
          code=$?
          if [ "$code" -eq 5 ]; then echo "No tests collected yet"; exit 0; fi
          exit $code
