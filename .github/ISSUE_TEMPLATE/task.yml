name: 작업
description: 기능, 문서, 테스트, 설정 등 일반 작업
title: "[feature] "
body:
  - type: textarea
    id: background
    attributes:
      label: 배경
      description: 왜 필요한지, 관련 설계 문서와 선행 이슈(#번호)
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: 작업
      description: 체크리스트로 작성
      value: |
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 기준
      description: 어떤 명령이나 테스트로 검증하는지
    validations:
      required: true
  - type: dropdown
    id: owner
    attributes:
      label: 담당
      options: [Claude, Codex, 사람]
    validations:
      required: true
