[project]
name = "fds-investigator"
version = "0.1.0"
description = "FDS investigation copilot MCP and agent runtime"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic",
    "jsonschema>=4,<5",
    "mcp>=1,<2",
    "pydantic>=2,<3",
]

[project.scripts]
fds-evidence-tools = "fds_investigator.server:main"
fds-investigate = "fds_investigator.agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fds_investigator"]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
